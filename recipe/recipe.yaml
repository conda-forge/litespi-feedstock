schema_version: 1

context:
  name: litespi
  version: "2026.08"
  sha256: 79cc4d29c1c0dd96a130e982712f035f4b9246597893defeb5bfffe0e18758da

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/litex-hub/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps
  python:
    entry_points:
      - litespi_gen = litespi.gen:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - litex ~=${{ version }}
    - liteiclink ~=${{ version }}
    - migen
    - packaging
    - pyyaml

tests:
  - python:
      imports:
        - litespi
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - litespi_gen --help

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Small footprint and configurable SPI core
  description: Small footprint and configurable SPI core
  homepage: https://github.com/litex-hub/litespi
  repository: https://github.com/litex-hub/litespi

extra:
  recipe-maintainers:
    - timkpaine
